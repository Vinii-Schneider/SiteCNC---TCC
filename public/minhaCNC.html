<script nonce="batatinha" defer>
window.addEventListener('DOMContentLoaded', async () => {
    const usuario = verificarLogin();
    if (!usuario) return;

    const gridLista = document.querySelector('.gridListaCNC');

    try {
        const res = await fetch('http://45.239.246.197:10100/listagemCNC', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario: usuario.nomeUsuario })
        });

        const responseData = await res.json();
        
        console.log('Resposta da API:', responseData);

        // Limpa a lista
        gridLista.innerHTML = '';

        if (!responseData.temCNC) {
            gridLista.innerHTML = '<li class="no-cnc">Você ainda não possui CNCs registradas.</li>';
            return;
        }

        // Cria o elemento da CNC
        const li = document.createElement('li');
        li.className = 'cnc-item';
        li.innerHTML = `
            <div class="cnc-info">
                <strong>Máquina ID:</strong> ${responseData.maquina_id}
            </div>
            <div class="cnc-status">
                <span class="status-badge">Ativa</span>
            </div>
        `;
        
        gridLista.appendChild(li);

    } catch (err) {
        console.error('Erro ao buscar CNCs do usuário:', err);
        gridLista.innerHTML = '<li class="error">Erro ao carregar CNCs.</li>';
    }
});
</script>
