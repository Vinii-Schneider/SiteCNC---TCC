<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registro CNC</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'nonce-batatinha' 'unsafe-inline';">
    <meta name="viewport"                      content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilosMinhaCNCMobile.css" media="screen and (max-width: 767px)">
    <link rel="stylesheet" href="estilosMinhaCNC.css"       media="screen and (min-width: 768px)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="/scripts/trocarlinguagem.js"  nonce="batatinha" defer></script>
    <script src="/scripts/registros.js"        nonce="batatinha" defer></script>
    <script src="/scripts/verificacaoLogin.js" nonce="batatinha" defer></script>
    <script src="/scripts/dropdownBarra.js"    nonce="batatinha" defer></script>
    <script src="/scripts/verificacaoCNC.js"   nonce="batatinha" defer></script>
    <script src="/scripts/perfil.js"           nonce="batatinha" defer></script>
</head>
<body>
    <header class="navegacao">
        <ul>
            <li><img width="40" height="40" src="/assets/window.png" alt="Logo provisória"></li>
            <li><a class="Home"     href="index.html"       >Home      </a></li>
            <li><a class="Projetos" href="projetos.html"    >Projetos  </a></li>
            <li><a                  href="sobre.html"       >Sobre     </a></li>
            <li><a class="FAQs"     href="registroCNC.html" >Minha CNC </a></li>
        </ul>
        <ul class="ElementosDireita">
            <li><a class="Login"    href="login.html"   >Login       </a></li>
            <li><a class="Registro" href="registro.html">Registrar-se</a></li>
            <li class="menuUsuario">
                <button id="secaoUsuario" style="display: none;">
                    <img  id="fotoPerfil" width="40" height="40" src="/assets/usuarioPadrao.png" alt="Foto de Perfil">
                    <span id="nomeUsuarioBarra">Nome do Usuário</span>
            </button>
                 <ul id="Dropdown">
                    <li><button id="nomePerfil" >Perfil</button></li>
                    <li><button id="configuracoesPerfil" data-url="/public/configuracoes.html">Configurações</button></li>
                    <li><button id="sairPerfil" >Sair  </button></li>
                </ul> 
            </li> 
        </ul>
    </header>
    <div class="conteudo">
        <div class="wrapperPrincipal">
            <div class="teste2">
                <!-- Ficará escondido caso haja uma CNC já registrada -->
                <h1>Registre sua CNC</h1>
                <form id="formRegistroCNC" enctype="multipart/form-data">
                    <label for="ID">ID da sua CNC: </label>
                    <input type="text" id="ID" name="Tituloo"><br><br>                                    
                    <button type="button" id="Verificar">Verificar</button>
                </form>
                <div id="avisoID" style="margin-top:10px; font-weight:bold;"></div>
            </div>
            <div class="wrapperPrincipalCNC">
                <div class="gridCNC">
                    <h1>Máquinas registradas: </h1>
                    <ul class="gridListaCNC"></ul>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
<script nonce="batatinha" defer>
window.addEventListener('DOMContentLoaded', async () => {
    // Pega o usuário logado
    const usuario = verificarLogin();
    if (!usuario) return;

    const gridLista = document.querySelector('.gridListaCNC');
    if (!gridLista) return;

    try {
        // Faz fetch no seu endpoint POST que retorna CNCs do usuário
        const res = await fetch('http://45.239.246.197:10100/listagemCNC', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario: usuario.nomeUsuario })
        });

        const cncList = await res.json();

        if (cncList.length === 0) {
            gridLista.innerHTML = '<li>Você ainda não possui CNCs registradas.</li>';
            return;
        }

        // Preenche a lista
        cncList.forEach(cnc => {
            const li = document.createElement('li');
            li.textContent = `ID: ${cnc.id} | Status: ${cnc.status} | Versão: ${cnc.versao}`;
            gridLista.appendChild(li);
        });

    } catch (err) {
        console.error('Erro ao buscar CNCs do usuário:', err);
        gridLista.innerHTML = '<li>Erro ao carregar CNCs.</li>';
    }
});
</script>
