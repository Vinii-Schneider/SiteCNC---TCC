<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sobre</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'nonce-batatinha' 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilosmobilelogin.css" media="screen and (max-width: 767px)">
    <link rel="stylesheet" href="estiloslogin.css" media="screen and (min-width: 768px)">
    <script src="/scripts/trocarlinguagem.js" nonce="batatinha"></script>
    <script src="/scripts/logins.js" nonce="batatinha"></script>
    <script src="/scripts/verificacaoLogin.js" nonce="batatinha"></script>
</head>
<body>
    <header class="navegacao">
        <ul>
            <li><img width="40" height="40" src="/assets/window.png" alt="Logo provisória"></li>
            <li><a class="Home" href="index.html">Home</a></li>
            <li><a class="Projetos" href="projetos.html">Projetos</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a class="FAQs" href="registroCNC.html">FAQs</a></li>
        </ul>
        <ul class="ElementosDireita">
            <li><a class="Login" href="login.html">Login</a></li>
            <li><a class="Registro" href="registro.html">Registrar-se</a></li>
            <li class="menuUsuario">
                <button id="secaoUsuario">
                    <img id="fotoPerfil" width="40" height="40" src="/assets/usuarioPadrao.png" alt="Foto de Perfil">
                    <span id="nomeUsuarioBarra">Nome do Usuário</span>
            </button>
                 <ul id="Dropdown">
                    <li><button id="nomePerfil" >Perfil</button></li>
                    <li><button id="configuracoesPerfil" data-url="/configuracoes">Configurações</button></li>
                    <li><button id="sairPerfil">Sair</button></li>
                </ul> 
            </li> 
        </ul>
    </header>
    <div class="conteudo">
        <div class="wrapperPrincipal">
            <div class="naosei">
                <div class="wrapperImagem">
                    <div class="imagemLogin">
                        <img src="/assets/bemvindo.jpg" height="504px" width="550px">
                    </div>
                </div>
                <div class="wrapperLogin">
                    <div class="conteudoLogin">
                        <div class="mensagemLogin">
                            <h2>Login</h2>
                            <p>Olá, bom vê-lo por aqui.</p>
                        </div>
                        <div class="formulario">           
                            <label for="nomeUsuario">Nome de usuário / e-mail: <br></br></label>
                            <input type="text" id="nomeUsuario"><br></br>
                            <label for="senha">Senha: <br></br></label>
                            <input type="password" id="senha"><br><br>  
                            <div id="mensagemErro" style="color: red; display: none; margin-top: -9px;"></div>                       
                        </div>
                        <div class="botoes">
                            <button type="button" id="botaoLogin">Prosseguir</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
