    <script src="/scripts/trocarlinguagem.js" nonce="batatinha"></script>

            <li><a class="Home" href="index.html">Home</a></li>

            <li><a href="sobre.html">Sobre</a></li>
            <li><a class="FAQs" href="registroCNC.html">FAQs</a></li>
        </ul>
        <ul class="ElementosDireita">
