<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Envios | CTRL</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'nonce-batatinha' 'unsafe-inline';">
    <meta name="viewport"                      content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/estiloPerfilMobile.css" media="screen and (max-width: 767px)">
    <link rel="stylesheet" href="/public/estiloPerfil.css"       media="screen and (min-width: 768px)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="/scripts/perfil.js"           nonce="batatinha" defer></script>
    <script src="/scripts/verificacaoLogin.js" nonce="batatinha" defer></script>
    <script src="/scripts/dropdownBarra.js"    nonce="batatinha" defer></script>
    <script src="/scripts/novoDisplayGrid.js"  nonce="batatinha" defer></script>
    <script src="/scripts/trocaFotoPerfil.js"  nonce="batatinha" defer></script>
<body>
    <header class="navegacao">
        <ul>
            <li><img width="40" height="40" src="/assets/window.png" alt="Logo provisória"></li>
            <li><a class="Home"     href="/public/index.html"       >Home      </a></li>
            <li><a class="Projetos" href="/public/projetos.html"    >Projetos  </a></li>
            <li><a                  href="/public/sobre.html"       >Sobre     </a></li>
            <li><a class="FAQs"     href="/public/registroCNC.html" >Minha CNC </a></li>
        </ul>
        <ul class="ElementosDireita">
            <li><a class="Login"    href="login.html"   >Login       </a></li>
            <li><a class="Registro" href="registro.html">Registrar-se</a></li>
            <li class="menuUsuario">
                <button id="secaoUsuario" style="display: none;">
                    <img  id="fotoPerfil" width="40" height="40" src="/assets/usuarioPadrao.png" alt="Foto de Perfil">
                    <span id="nomeUsuarioBarra">Nome do Usuário</span>
            </button>
                 <ul id="Dropdown">
                    <li><button id="nomePerfil" >Perfil</button></li>
                    <li><button id="configuracoesPerfil" data-url="/public/configuracoes.html">Configurações</button></li>
                    <li><button id="sairPerfil" >Sair  </button></li>
                </ul> 
            </li> 
        </ul>
    </header>
    <div class="wrapperConteudo">
        <div class="conteudo">
            <div style="margin-left: -40px" class="colunaEsquerda">
                <ul class="elementosColuna">
                    <h1 style="margin-top: 20px; margin-bottom: 60px; width: 100%;">Perfil</h1>
                    <li><button onclick="mostrarProjetosUsuario()" style="border:none; font-size: 21px;" nonce="batatinha">Projetos do usuário</button></li>
                    <li><button onclick="mostrarInformacoesGerais()" style="border:none; font-size: 21px;" nonce="batatinha">Informações do usuário</button></li>
                    <li><button onclick="mostrarSegurancaLogin()" style="border:none; font-size: 21px;" nonce="batatinha">Segurança & login</button></li>
                </ul>
            </div>
            <div class="paginaMain">
                <div class="banner"><img src="/assets/maxwell.jpg" style="width: 100%; height: 200px; object-fit: fill;"></div>
                <img src="/assets/usuarioPadrao.png" height="130px" alt="Imagem de perfil" id="imagemPerfil"><h1 id="nomeUsuarioBanner" style="margin-top: -55px; margin-left: 180px;"></h1>

                <input type="file" id="uploadFoto" accept="image/*" style="display: none;">

                <div class="forms">
                    <h1 id="projetosUser" style="margin-top: 80px;">Projetos de </h1>
                </div>
                <div class="conteudosLista">
                    <ul class="gridLista"></ul>
                </div>
            </div>
        </div>
    </div>
    <script nonce="batatinha" defer>
        function mostrarPerfilPublico() {
            document.getElementById('Forms').innerHTML = '<p>Conteúdo dos projetos</p>';
        }
        function mostrarInformacoesGerais() {
            document.getElementById('Forms').innerHTML = '<p>Conteúdo das Informações Gerais</p>';
        }
        function mostrarSegurancaLogin() {
            document.getElementById('Forms').innerHTML = '<p>Conteúdo de Segurança & Login</p>';
        }
    </script>
    <script nonce="batatinha" defer>
        const partesURL = window.location.href.split('/');
        let nomeUsuario = partesURL[partesURL.length - 1].replace('.html', '');
        nomeUsuario = nomeUsuario.charAt(0).toUpperCase() + nomeUsuario.slice(1).toLowerCase();

        document.getElementById('nomeUsuarioBanner').innerText = nomeUsuario;
        document.getElementById('projetosUser').textContent = `${nomeUsuario}:`;

        const imagemPerfil = document.getElementById('imagemPerfil');
        const uploadInput = document.getElementById('uploadFoto');

        imagemPerfil.addEventListener('click', () => {
            uploadInput.click();
        });

        uploadInput.addEventListener('change', async (event) => {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const urlTemp = URL.createObjectURL(arquivo);
            imagemPerfil.src = urlTemp;

            const formData = new FormData();
            formData.append('fotoPerfil', arquivo); 
            formData.append('nomeUsuario', nomeUsuario);

            try {
                const resposta = await fetch('http://45.239.246.197:10100/atualizarFotoPerfil', {
                    method: 'POST',
                    body: formData
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    console.log('Foto atualizada com sucesso:', resultado.nomeImagem);
                } else {
                    console.error('Erro:', resultado.error);
                    alert('Erro ao atualizar foto de perfil.');
                }
            } catch (erro) {
                console.error('Erro na requisição:', erro);
                alert('Erro ao conectar ao servidor.');
            }
        });
</script>

</body>
</html>
