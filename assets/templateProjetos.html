<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>${projeto.titulo} | ${projeto.nome}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/estilosProjetoMobile.css" media="screen and (max-width: 767px)">
    <link rel="stylesheet" href="/public/estiloProjeto.css" media="screen and (min-width: 768px)">
    <script src="/scripts/verificacaoLogin.js" nonce="batatinha" defer></script>
    <script src="/scripts/dropdownBarra.js" nonce="batatinha" defer></script>
</head>
<body>
    <div class="navegacao">
        <ul>
            <li><img width="40" height="40" src="/assets/window.png" alt="Logo provisória" id="logo"></li>
            <li><a class="Home" href="/public/index.html">Home</a></li>
            <li><a class="Projetos" href="/public/projetos.html">Projetos</a></li>
            <li id="sobre"><a href="/public/sobre.html">Sobre</a></li>
            <li id="faqs"><a class="FAQs" href="/public/registroCNC.html">FAQs</a></li>
        </ul>
        <ul class="ElementosDireita">
            <li><a class="Login" href="/public/login.html">Login</a></li>
            <li><a class="Registro" href="/public/registro.html">Registrar-se</a></li>
            <li class="menuUsuario">
                <button id="secaoUsuario">
                    <img id="fotoPerfil" width="40" height="40" src="/assets/usuarioPadrao.png" alt="Foto de Perfil">
                    <span id="nomeUsuarioBarra">Nome do Usuário</span>
                </button>
                <ul id="Dropdown">
                    <li><button id="nomePerfil" >Perfil</button></li>
                    <li><button id="configuracoesPerfil" data-url="/configuracoes">Configurações</button></li>
                    <li><button id="sairPerfil">Sair</button></li>
                </ul> 
            </li>
            <li><img class="modoimagem" width="30" height="30" src="/assets/modoescuronovo.png" alt="Modo escuro" onclick="TrocarModo()"></li>   
            <script src="/scripts/modoescuro.js" nonce="batatinha"></script>
            <li><img class="trocalinguagem" height="40" src="/assets/brazil.png" id="bandeira"></li>
            <script src="/scripts/trocarlinguagem.js" nonce="batatinha"></script>
        </ul>
    </div>
    <div class="conteudo">
        <div class="wrapperTextoInicio">
            <div class="textoInicio">
                <banner></banner>
                <h1>${projeto.titulo}</h1>
                <div class="elementosSubtitulo"><img src="/assets/usuarioPadrao.png" height="35px" width="35px" style="padding-right: 20px;"><a href="/Usuarios/${projeto.caminho}">${projeto.nome}</a></div>
                <p>${projeto.descricao}</p>
            </div>
        </div>
        <div class="texto">
            <h1>${projeto.titulo}</h1>
            <ul class="dadosProjeto">
                <li class="autor">${projeto.nome}</li>
                <li class="dataCriacao">${projeto.dataCriacao}</li>
                <li class="diretorioProjeto"><a href='/public/projetos.html'>ProjetosSubmetidos</a></li>
                <li class="comentarios"></li>
            </ul>
        </div>  
    </div>

</body>
</html>
